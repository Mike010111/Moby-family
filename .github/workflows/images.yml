name: Images

# Образы сервисов и фронтенда в GitHub Container Registry: ghcr.io/<owner>/moby-<service>:{latest,<sha>}.
# docker compose берёт их вместо локальной сборки (Codespaces стартует за минуты, а не за сборку Maven).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway, port: 8080, dockerfile: infra/docker/service.Dockerfile }
          - { name: payment, port: 8081, dockerfile: infra/docker/service.Dockerfile }
          - { name: family, port: 8082, dockerfile: infra/docker/service.Dockerfile }
          - { name: rewards, port: 8083, dockerfile: infra/docker/service.Dockerfile }
          - { name: notification, port: 8084, dockerfile: infra/docker/service.Dockerfile }
          - { name: frontend, port: 80, dockerfile: infra/docker/frontend.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - name: Image name (ghcr требует нижний регистр)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/moby-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            SERVICE=${{ matrix.name }}
            PORT=${{ matrix.port }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=moby-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=moby-${{ matrix.name }}
