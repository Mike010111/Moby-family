name: Pages

# Офлайн-демо фронтенда на GitHub Pages (логика прототипа в браузере, без бэкенда) и бейдж покрытия.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Tests and coverage (JaCoCo)
        id: verify
        continue-on-error: true
        run: ./mvnw -B verify
      - name: Site = frontend/ + coverage badge (shields.io endpoint)
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          mkdir -p _site/badges
          cp -R frontend/index.html frontend/config.js frontend/css frontend/js frontend/spec frontend/assets _site/
          python3 - <<'PY'
          import csv, glob, json, os
          missed = covered = 0
          for path in glob.glob('services/*/target/site/jacoco/jacoco.csv'):
              for row in csv.DictReader(open(path)):
                  missed += int(row['LINE_MISSED'])
                  covered += int(row['LINE_COVERED'])
          if os.environ['VERIFY_OUTCOME'] != 'success' or not covered:
              badge = {'message': 'failing', 'color': 'red'}
          else:
              pct = 100 * covered / (missed + covered)
              badge = {'message': f'{pct:.0f}%', 'color': 'brightgreen' if pct >= 80 else 'orange'}
          json.dump({'schemaVersion': 1, 'label': 'coverage', **badge}, open('_site/badges/coverage.json', 'w'))
          print(badge)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
