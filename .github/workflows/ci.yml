name: CI

on:
  push:
    branches: [main, backend]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test (Testcontainers, ArchUnit, Modulith, JaCoCo)
        run: ./mvnw -B clean verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/target/surefire-reports/
            **/target/site/jacoco/
          retention-days: 7

  frontend-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JS prototype scenario tests (executable specification)
        working-directory: frontend
        run: npm test

  frontend-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Offline demo as on GitHub Pages (static files, no backend)
        run: npm run test:e2e

  e2e:
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose configuration
        run: docker compose config --quiet
      - name: Build images and start the stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Smoke test through the gateway
        run: scripts/smoke.sh
      - name: Frontend survives a gateway restart
        run: |
          docker compose restart gateway
          docker compose up -d --wait --wait-timeout 300
          curl -sf http://localhost:5173/api/health | grep -q '"UP"'
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=200
