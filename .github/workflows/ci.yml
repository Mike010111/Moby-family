name: CI

on:
  push:
    branches: [main, backend]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (Testcontainers)
        run: ./gradlew build --no-daemon
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/jacoco/
          retention-days: 7

  frontend-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JS prototype scenario tests (executable specification)
        working-directory: frontend
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose configuration
        run: docker compose config --quiet
      - name: Build images and start the stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Smoke test through the gateway
        run: scripts/smoke.sh
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=200
