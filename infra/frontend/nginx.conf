# Стенд: статика прототипа + /api на gateway и /realms на Keycloak (один origin — без CORS и без отдельных
# публичных портов, в том числе в Codespaces).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Адреса upstream — через DNS Docker при каждом запросе (переменные в proxy_pass), а не один раз при старте:
    # после `docker compose restart gateway` у контейнера может смениться IP, а nginx продолжит работать.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8080;
    set $keycloak http://keycloak:8080;

    # SSE: без буферизации и с долгим таймаутом чтения
    location /api/notifications/stream {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Вход демо-пользователей (password grant). Адрес в токене (iss) задаёт KC_HOSTNAME, а не этот прокси.
    location /realms/ {
        proxy_pass $keycloak;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # config.js пишется при старте контейнера из переменных окружения — без кэша, как и остальные скрипты
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }
}
