name: moby

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.2
    environment:
      CLUSTER_ID: moby-family-kafka-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    ports:
      - "${KAFKA_PORT:-19092}:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Токены выпускаются с iss = адрес, по которому Keycloak видят браузер и smoke.sh
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx512m
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak/moby-realm.json:/opt/keycloak/data/import/moby-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  payment:
    build: &service-build
      context: ..
      dockerfile: infra/docker/service.Dockerfile
      args: { SERVICE: payment, PORT: 8081 }
    environment: &service-env
      SPRING_PROFILES_ACTIVE: demo
      DB_HOST: postgres
      DB_PORT: 5432
      KAFKA_BOOTSTRAP: kafka:9092
      JWT_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/moby
      JWK_SET_URI: http://keycloak:8080/realms/moby/protocol/openid-connect/certs
      REWARDS_URL: http://rewards:8083
      PAYMENT_URL: http://payment:8081
      OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on: &service-deps
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    mem_limit: 512m
    restart: unless-stopped

  family:
    build:
      <<: *service-build
      args: { SERVICE: family, PORT: 8082 }
    environment: *service-env
    depends_on: *service-deps
    mem_limit: 512m
    restart: unless-stopped

  rewards:
    build:
      <<: *service-build
      args: { SERVICE: rewards, PORT: 8083 }
    environment: *service-env
    depends_on: *service-deps
    mem_limit: 512m
    restart: unless-stopped

  notification:
    build:
      <<: *service-build
      args: { SERVICE: notification, PORT: 8084 }
    environment: *service-env
    depends_on: *service-deps
    mem_limit: 512m
    restart: unless-stopped

  gateway:
    build:
      <<: *service-build
      args: { SERVICE: gateway, PORT: 8080 }
    environment:
      JWT_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/moby
      JWK_SET_URI: http://keycloak:8080/realms/moby/protocol/openid-connect/certs
      PAYMENT_URL: http://payment:8081
      FAMILY_URL: http://family:8082
      REWARDS_URL: http://rewards:8083
      NOTIFICATION_URL: http://notification:8084
      OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      keycloak: { condition: service_healthy }
    mem_limit: 384m
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      gateway: { condition: service_healthy }
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "${JAEGER_PORT:-16686}:16686"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:13133/status > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/moby-family.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

volumes:
  pgdata:
