server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: payment
              uri: ${PAYMENT_URL:http://localhost:8081}
              predicates:
                - Path=/api/payment/**
            - id: family
              uri: ${FAMILY_URL:http://localhost:8082}
              predicates:
                - Path=/api/family/**
            - id: rewards
              uri: ${REWARDS_URL:http://localhost:8083}
              predicates:
                - Path=/api/rewards/**
            - id: notification
              uri: ${NOTIFICATION_URL:http://localhost:8084}
              predicates:
                - Path=/api/notifications/**
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
