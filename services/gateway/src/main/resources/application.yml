server:
  port: 8080

spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8180/realms/moby}
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8180/realms/moby/protocol/openid-connect/certs}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: payment
              uri: ${PAYMENT_URL:http://localhost:8081}
              predicates:
                - Path=/api/payment/**
            - id: family
              uri: ${FAMILY_URL:http://localhost:8082}
              predicates:
                - Path=/api/family/**
            - id: rewards
              uri: ${REWARDS_URL:http://localhost:8083}
              predicates:
                - Path=/api/rewards/**
            - id: notification
              uri: ${NOTIFICATION_URL:http://localhost:8084}
              predicates:
                - Path=/api/notifications/**
              metadata:
                # SSE-поток живёт долго: общий response-timeout к нему не применяется
                response-timeout: -1
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s

management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
