server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: family
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/family
    username: ${DB_USER:family}
    password: ${DB_PASSWORD:family}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://localhost:8180/realms/moby}
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8180/realms/moby/protocol/openid-connect/certs}
  mvc:
    problemdetails:
      enabled: true

moby:
  clients:
    payment:
      url: ${PAYMENT_URL:http://localhost:8081}
      connect-timeout: 1s
      read-timeout: 3s

springdoc:
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
