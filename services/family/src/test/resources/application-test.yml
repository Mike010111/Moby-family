moby:
  clients:
    payment:
      url: http://localhost:1

spring:
  modulith:
    events:
      externalization:
        enabled: false
  kafka:
    admin:
      auto-create: false
    listener:
      auto-startup: false

logging:
  level:
    org.springframework.modulith: warn

management:
  tracing:
    export:
      enabled: false
